[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgld-cv-research"
version = "0.1.0"
description = "Reproducible second-order control variate experiments for SGLD"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "matplotlib>=3.6", "POT>=0.9", "arviz>=0.21,<0.22", "threadpoolctl>=3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
